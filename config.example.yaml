listen: ":18787"
# 若经反向代理对外暴露，填公网可达地址（影响 WS endpoint 下发的 URL）
# publicHost: "http://127.0.0.1:18787"
upstream:
  domain: "https://open.feishu.cn"
duckdb:
  path: "./data/larkinfra.duckdb"
  storeBodies: true
  bodyMaxChars: 4096

# 业务应用 id/secret 不再需要在此集中配置。
# Agent 用官方 WSClient 接入时携带 AppID/AppSecret，网关在
# /callback/ws/endpoint 上自动注册，并按需拉起飞书上游长连接。
# 实例环境不在这里配置：每个进程启动时用 LARK_APP_ENV 声明
# （dev | test | staging | prod，stage 视为 staging）。
appDefaults:
  # 连飞书上游的连接数；本地只测下游时可设为 0
  upstreamConnections: 1

routing:
  strategy: consistent_hash
  key: user_id
  ackTimeoutMs: 2500
admin:
  token: "dev-token"
ws:
  serviceId: 33554678
  pingIntervalSec: 90
  reconnectCount: -1
  reconnectIntervalSec: 90
  reconnectNonceSec: 25
  instanceTtlMs: 180000
  # Agent 握手拉起飞书上游后，若该时长内无实例连上网关则自动关闭上游
  upstreamIdleTimeoutMs: 60000
